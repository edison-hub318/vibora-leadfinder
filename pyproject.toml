[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadfinder"
version = "1.0.0"
description = "Vibora lead finder: find local UK businesses with weak websites, call them, and email them within UK law."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
    # Windows has no system time-zone database; zoneinfo needs this package there.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leadfinder = "leadfinder.cli:main"

[tool.setuptools.packages.find]
include = ["leadfinder*"]

[tool.setuptools.package-data]
leadfinder = ["web/templates/*.html", "web/templates/partials/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
