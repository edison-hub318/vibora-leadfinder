# Trades for the lead search. Edit freely - the dashboard and CLI read this file every time.
#
# Each trade has:
#   label     - how it's shown
#   family    - which preview-site template to use: trades | beauty | food | professional | generic
#   synonyms  - extra Google queries tried when the main one doesn't find enough leads
#   types     - Google place "primaryType" values that count as this trade
#   keywords  - words in a business name that count as this trade (lower case)
#   services  - generic services listed on the preview site
#
# A trade that isn't listed here still searches: the typed text is used as the query and
# the category check is skipped.

plumbers:
  label: Plumbers
  family: trades
