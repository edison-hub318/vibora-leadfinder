# Thresholds for classifying a real website.
thresholds:
  # PageSpeed mobile performance score (0-100) below this is "poor".
  pagespeed_poor_below: 50
  # Below this (but above the poor line) counts as a minor "slow on mobile" issue.
  pagespeed_minor_below: 70
  # Copyright year older than this many years is a minor issue ("stale").
  copyright_stale_years: 2
  # Older than this many years makes the site "poor".
  copyright_poor_years: 3
  # This many broken internal links (or more) makes the site "poor".
  broken_links_poor: 3
  # Up to this many minor issues is "ok"; more than this is "poor".
  ok_max_minor_issues: 2
  # Internal links checked per site.
  max_links_checked: 10
  # Homepage fetch timeout (seconds).
  fetch_timeout: 15

# Text that suggests a parked or for-sale domain.
parked_phrases:
  - this domain is for sale
  - buy this domain
  - domain may be for sale
  - this domain has been registered
  - parked free
  - parkingcrew
  - sedoparking
  - hugedomains
  - dan.com
  - domain parking
  - this web page is parked

# Weaker signals, only counted as "parked" when the page has very little text on it.
placeholder_phrases:
  - future home of
  - coming soon
  - website coming soon
  - under construction

# "Website by ..." credits that are just platforms, not agencies.
platform_names:
